name: Groovy tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Groovy 2.4.21
        run: |
          curl --fail --location --silent --show-error --output /tmp/groovy-all.jar https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-all/2.4.21/groovy-all-2.4.21.jar
          echo 'de65260cf2070442e99882f2f3d72e7531725c1e6a257446cc0cea525c607bd0  /tmp/groovy-all.jar' | sha256sum --check
      - name: Run driver tests
        run: java -cp /tmp/groovy-all.jar groovy.ui.GroovyMain tests/PresenceConsensusTest.groovy
